<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="operations.js" defer></script>
    <title>Odin-Calculator</title>
</head>
<body>
    <div id="calculatorFrame">
        <input type="text" id="calculatorDisplay" maxlength="15" disabled></input>
        <div id="calculatorInput">
            <button class="inputBtn grey" onclick="clearDisplay(), event.currentTarget.blur()">AC</button>
            <button class="inputBtn grey" onclick="deleteLastInput(), event.currentTarget.blur()">⌫</button>
            <button class="inputBtn operator" onclick="appendOperation('/'), event.currentTarget.blur()">/</button>
            <button class="inputBtn operator" onclick="appendOperation('*'), event.currentTarget.blur()">*</button>
            <button class="inputBtn number" onclick="appendNumber('7'), event.currentTarget.blur()">7</button>
            <button class="inputBtn number" onclick="appendNumber('8'), event.currentTarget.blur()">8</button>
            <button class="inputBtn number" onclick="appendNumber('9'), event.currentTarget.blur()">9</button>
            <button class="inputBtn operator" onclick="appendOperation('-'), event.currentTarget.blur()">-</button>
            <button class="inputBtn number" onclick="appendNumber('4'), event.currentTarget.blur()">4</button>
            <button class="inputBtn number" onclick="appendNumber('5'), event.currentTarget.blur()">5</button>
            <button class="inputBtn number" onclick="appendNumber('6'), event.currentTarget.blur()">6</button>
            <button class="inputBtn operator" onclick="appendOperation('+'), event.currentTarget.blur()">+</button>
            <button class="inputBtn number" onclick="appendNumber('1'), event.currentTarget.blur()">1</button>
            <button class="inputBtn number" onclick="appendNumber('2'), event.currentTarget.blur()">2</button>
            <button class="inputBtn number" onclick="appendNumber('3'), event.currentTarget.blur()">3</button>
            <button class="inputBtn equal" onclick="operate(), event.currentTarget.blur()">=</button>
            <button class="inputBtn number" onclick="appendNumber('0'), event.currentTarget.blur()">0</button>
            <button class="inputBtn number" onclick="appendDot(), event.currentTarget.blur()">.</button>
            <button class="inputBtn grey" onclick="negate(), event.currentTarget.blur()">+/-</button>
        </div>
    </div>
    <div id="label">
        <h3>Keyboard Inputs</h3>
        <p>
            Press underscore to negate the input 
        </p>
        <p>
            Press escape to clear
        </p>
    </div>
</body>
</html>
