<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="operations.js" defer></script>
    <title>Odin-Calculator</title>
</head>
<body>
    <div id="calculatorFrame">
        <div id="calculatorDisplay">
            <span id="firstValue" class="value">4837</span>
            <span id="operator" class="operator">/</span>
            <span id="secondValue" class="value">384</span>
        </div>
        <div id="calculatorInput">
            <button class="inputBtn grey" id="acBtn">AC</button>
            <button class="inputBtn grey" id="deleteBtn">⌫</button>
            <button class="inputBtn operator" id="divisionBtn">/</button>
            <button class="inputBtn operator" id="multiplicationBtn">*</button>
            <button class="inputBtn number" id="7">7</button>
            <button class="inputBtn number" id="8">8</button>
            <button class="inputBtn number" id="9">9</button>
            <button class="inputBtn operator" id="suptractionBtn">-</button>
            <button class="inputBtn number" id="4">4</button>
            <button class="inputBtn number" id="5">5</button>
            <button class="inputBtn number" id="6">6</button>
            <button class="inputBtn operator" id="additionBtn">+</button>
            <button class="inputBtn number" id="1">1</button>
            <button class="inputBtn number" id="2">2</button>
            <button class="inputBtn number" id="3">3</button>
            <button class="inputBtn equal" id="equalBtn">=</button>
            <button class="inputBtn number" id="0">0</button>
            <button class="inputBtn number" id="dotBtn">.</button>
            <button class="inputBtn grey" id="negationBtn">+/-</button>
        </div>
    </div>
</body>
</html>
